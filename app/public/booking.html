<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Đặt Vé Xem Phim - Đề 11</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 800px; width: 100%; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-weight: 600; }
        select, input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #38bdf8; text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Quay lại Cổng thông tin chính</a>
        <h1>🎟️ Đặt Vé Xem Phim Trực Tuyến</h1>
        
        <form id="bookingForm">
            <div class="form-group">
                <label for="movie">Chọn Phim Suất Chiếu:</label>
                <select id="movie" name="movie_id" required>
                    <option value="">Đang tải danh sách phim...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="customer_name">Họ và Tên Khách Hàng:</label>
                <input type="text" id="customer_name" name="customer_name" placeholder="Nhập họ tên của bạn" required>
            </div>

            <div class="form-group">
                <label for="seat_number">Số Ghế Ngồi (Ví dụ: A1, B5,...):</label>
                <input type="text" id="seat_number" name="seat_number" placeholder="Nhập số ghế" required>
            </div>

            <button type="submit">Xác Nhận Đặt Vé</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        // Tự động tải danh sách phim từ API khi mở trang
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/movies');
                const movies = await res.json();
                const select = document.getElementById('movie');
                select.innerHTML = '<option value="">-- Chọn phim suất chiếu --</option>';
                
                if(movies.length === 0) {
                    select.innerHTML = '<option value="">Chưa có phim nào trong cơ sở dữ liệu</option>';
                    return;
                }

                movies.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = `${m.title} (${m.genre}) - Giá: ${m.price} VNĐ`;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error('Lỗi tải phim:', err);
            }
        });

        // Xử lý gửi dữ liệu đặt vé
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const movie_id = document.getElementById('movie').value;
            const customer_name = document.getElementById('customer_name').value;
            const seat_number = document.getElementById('seat_number').value;

            try {
                const res = await fetch('/api/bookings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ movie_id, customer_name, seat_number })
                });
                const data = await res.json();
                const msg = document.getElementById('message');
                if (res.ok) {
                    msg.style.color = '#4ade80';
                    msg.textContent = '🎉 ' + data.message;
                    document.getElementById('bookingForm').reset();
                } else {
                    msg.style.color = '#f87171';
                    msg.textContent = '❌ Lỗi: ' + data.error;
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
