<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Đặt Vé Xem Phim - Đề 11</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; color: #333; }
        h1, h2 { color: #2c3e50; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #3498db; color: white; }
        input, select, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #2ecc71; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <h1>🎬 Hệ Thống Đặt Vé Xem Phim (Đề 11)</h1>

    <div class="container">
        <h2>Danh Sách Phim Đang Chiếu</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên Phim</th>
                    <th>Thể Loại</th>
                    <th>Giá Vé ($)</th>
                </tr>
            </thead>
            <tbody id="movieTableBody">
                <!-- Dữ liệu phim sẽ được load tự động bằng JavaScript -->
            </tbody>
        </table>
    </div>

    <div class="container">
        <h2>🎟️ Form Đặt Vé</h2>
        <form id="bookingForm">
            <label for="movieId">Chọn ID Phim:</label>
            <input type="number" id="movieId" required placeholder="Nhập ID phim (VD: 3)">

            <label for="customerName">Họ và Tên Khách Hàng:</label>
            <input type="text" id="customerName" required placeholder="Nguyen Van A">

            <label for="seatNumber">Số Ghế:</label>
            <input type="text" id="seatNumber" required placeholder="A5">

            <button type="submit">Xác Nhận Đặt Vé</button>
        </form>
        <p id="resultMsg" style="font-weight: bold; margin-top: 10px;"></p>
    </div>

    <script>
        // Tải danh sách phim khi trang được mở
        async function loadMovies() {
            try {
                const response = await fetch('/api/movies');
                const movies = await response.json();
                const tbody = document.getElementById('movieTableBody');
                tbody.innerHTML = '';
                movies.forEach(movie => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${movie.id}</td>
                            <td>${movie.title}</td>
                            <td>${movie.genre}</td>
                            <td>${movie.price}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Lỗi tải danh sách phim:', error);
            }
        }

        // Xử lý sự kiện đặt vé
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const bookingData = {
                movie_id: parseInt(document.getElementById('movieId').value),
                customer_name: document.getElementById('customerName').value,
                seat_number: document.getElementById('seatNumber').value
            };

            try {
                const response = await fetch('/api/bookings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookingData)
                });
                const result = await response.json();
                const msgEl = document.getElementById('resultMsg');
                if (response.ok) {
                    msgEl.style.color = 'green';
                    msgEl.innerText = result.message + ' (Mã vé: ' + result.bookingId + ')';
                } else {
                    msgEl.style.color = 'red';
                    msgEl.innerText = 'Lỗi: ' + result.error;
                }
            } catch (error) {
                console.error('Lỗi đặt vé:', error);
            }
        });

        loadMovies();
    </script>
</body>
</html>
