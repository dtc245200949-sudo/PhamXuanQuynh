version: '3.8'

services:
  app:
    build: ./app
    container_name: ticket-app
    restart: always
    networks:
      - app-net
    expose:
      - "3000"

  db:
    image: mysql:8.0
    container_name: ticket-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ticketdb
      MYSQL_USER: ticketuser
      MYSQL_PASSWORD: ticketpassword
    networks:
      - app-net
    volumes:
      - db_data:/var/lib/mysql

  nginx:
    image: nginx:alpine
    container_name: ticket-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  db_data: